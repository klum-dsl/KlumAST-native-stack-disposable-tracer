name: Stack event evidence

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect-stack-event:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Record safe pull-request metadata
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          STACK: ${{ toJson(github.event.pull_request.stack) }}
        run: |
          {
            echo "head_ref=${HEAD_REF}"
            echo "base_ref=${BASE_REF}"
            echo "stack=${STACK}"
          } >> "$GITHUB_STEP_SUMMARY"

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: >
            -Dsonar.projectKey=klum-dsl_KlumAST-native-stack-disposable-tracer
            -Dsonar.organization=klum-dsl
            -Dsonar.sources=.github/workflows
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
